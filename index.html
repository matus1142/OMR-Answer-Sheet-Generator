<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Answer Sheet Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 2em;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: #555;
            min-width: 80px;
        }

        .control-group input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e5e7eb;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            margin-top: 5px;
        }

        .answer-sheet {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        .question-item:hover {
            background: #f9fafb;
        }

        .question-item:last-child {
            border-bottom: none;
        }

        .question-number {
            font-weight: bold;
            font-size: 18px;
            color: #374151;
            min-width: 50px;
        }

        .choices {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .choice-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .choice-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .choice-label {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            user-select: none;
        }

        .settings-panel {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #667eea;
        }

        .settings-panel h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .question-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📝 OMR Answer Sheet Generator</h1>

            <div class="controls">
                <button class="btn btn-secondary" onclick="toggleSettings()">
                    ⚙️ ตั้งค่า
                </button>
                <button class="btn btn-success" onclick="exportToHTML()">
                    💾 Export HTML
                </button>
                <button class="btn btn-primary" onclick="exportToMarkdown()">
                    📄 Export Markdown
                </button>
                <button class="btn btn-danger" onclick="clearAnswers()">
                    🗑️ ล้างคำตอบ
                </button>
            </div>

            <!-- Settings Panel -->
            <div id="settingsPanel" class="settings-panel hidden">
                <h3>⚙️ การตั้งค่า</h3>
                <div class="settings-grid">
                    <div class="control-group">
                        <label>จำนวนข้อ:</label>
                        <input type="number" id="numQuestions" value="20" min="1" max="200" onchange="updateQuestions()">
                    </div>
                    <div class="control-group">
                        <label>ตัวเลือก:</label>
                        <input type="number" id="numChoices" value="4" min="2" max="10" onchange="updateQuestions()">
                    </div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="answeredCount">0</div>
                    <div class="stat-label">ตอบแล้ว</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="unansweredCount">20</div>
                    <div class="stat-label">ยังไม่ได้ตอบ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">20</div>
                    <div class="stat-label">ทั้งหมด</div>
                </div>
            </div>
        </div>

        <!-- Answer Sheet -->
        <div class="answer-sheet">
            <div id="questionContainer"></div>
        </div>
    </div>

    <script>
        let answers = {};
        let numQuestions = 20;
        let numChoices = 4;

        function init() {
            updateQuestions();
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function getChoices() {
            const choices = [];
            for (let i = 0; i < numChoices; i++) {
                choices.push(String.fromCharCode(65 + i)); // A, B, C, D, ...
            }
            return choices;
        }

        function updateQuestions() {
            numQuestions = parseInt(document.getElementById('numQuestions').value);
            numChoices = parseInt(document.getElementById('numChoices').value);

            const choices = getChoices();
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';

            // Clear invalid answers
            const newAnswers = {};
            Object.keys(answers).forEach(q => {
                const qNum = parseInt(q);
                if (qNum <= numQuestions && answers[q]) {
                    const choiceIndex = answers[q].charCodeAt(0) - 65;
                    if (choiceIndex < numChoices) {
                        newAnswers[q] = answers[q];
                    }
                }
            });
            answers = newAnswers;

            for (let i = 1; i <= numQuestions; i++) {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';

                const numberDiv = document.createElement('div');
                numberDiv.className = 'question-number';
                numberDiv.textContent = i + '.';

                const choicesDiv = document.createElement('div');
                choicesDiv.className = 'choices';

                choices.forEach(choice => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'choice-wrapper';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'choice-checkbox';
                    checkbox.id = `q${i}_${choice}`;
                    checkbox.checked = answers[i] === choice;
                    checkbox.onchange = () => handleAnswerChange(i, choice, checkbox.checked);

                    const label = document.createElement('label');
                    label.className = 'choice-label';
                    label.htmlFor = `q${i}_${choice}`;
                    label.textContent = choice;

                    wrapper.appendChild(checkbox);
                    wrapper.appendChild(label);
                    choicesDiv.appendChild(wrapper);
                });

                questionDiv.appendChild(numberDiv);
                questionDiv.appendChild(choicesDiv);
                container.appendChild(questionDiv);
            }

            updateStats();
        }

        function handleAnswerChange(questionNum, choice, checked) {
            const choices = getChoices();

            if (checked) {
                // Uncheck other choices for this question
                choices.forEach(c => {
                    if (c !== choice) {
                        const otherCheckbox = document.getElementById(`q${questionNum}_${c}`);
                        if (otherCheckbox) {
                            otherCheckbox.checked = false;
                        }
                    }
                });
                answers[questionNum] = choice;
            } else {
                delete answers[questionNum];
            }

            updateStats();
        }

        function updateStats() {
            const answered = Object.keys(answers).length;
            const unanswered = numQuestions - answered;

            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('unansweredCount').textContent = unanswered;
            document.getElementById('totalCount').textContent = numQuestions;
        }

        function clearAnswers() {
            if (confirm('ต้องการลบคำตอบทั้งหมดใช่หรือไม่?')) {
                answers = {};
                updateQuestions();
            }
        }

        function exportToMarkdown() {
            const choices = getChoices();
            let markdown = `# OMR Answer Sheet\n\n`;
            markdown += `**วันที่สร้าง:** ${new Date().toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            })}\n\n`;
            markdown += `**จำนวนข้อทั้งหมด:** ${numQuestions} ข้อ\n`;
            markdown += `**จำนวนตัวเลือก:** ${numChoices} (${choices.join(', ')})\n\n`;
            markdown += `---\n\n`;
            markdown += `## 📋 รายละเอียดคำตอบ\n\n`;

            for (let i = 1; i <= numQuestions; i++) {
                const answer = answers[i];
                markdown += `**${i}.** `;

                const choiceItems = choices.map(choice => {
                    if (answer === choice) {
                        return `${choice} [x]`;
                    } else {
                        return `${choice} [ ]`;
                    }
                });

                markdown += choiceItems.join(' ') + '\n\n';
            }

            markdown += `---\n\n`;
            markdown += `## 📊 สรุปผล\n\n`;
            markdown += `| รายการ | จำนวน |\n`;
            markdown += `|--------|--------|\n`;
            markdown += `| ตอบแล้ว | ${Object.keys(answers).length} ข้อ |\n`;
            markdown += `| ยังไม่ได้ตอบ | ${numQuestions - Object.keys(answers).length} ข้อ |\n`;
            markdown += `| รวมทั้งหมด | ${numQuestions} ข้อ |\n\n`;

            markdown += `## ✅ คำตอบที่เลือก\n\n`;
            const answeredQuestions = Object.keys(answers).map(Number).sort((a, b) => a - b);
            if (answeredQuestions.length > 0) {
                answeredQuestions.forEach(q => {
                    markdown += `${q}. ${answers[q]}\n`;
                });
            } else {
                markdown += `*ยังไม่มีการเลือกคำตอบ*\n`;
            }

            markdown += `\n## ⏳ ข้อที่ยังไม่ได้ตอบ\n\n`;
            const unanswered = [];
            for (let i = 1; i <= numQuestions; i++) {
                if (!answers[i]) {
                    unanswered.push(i);
                }
            }
            if (unanswered.length > 0) {
                markdown += unanswered.join(', ') + '\n';
            } else {
                markdown += `*ตอบครบทุกข้อแล้ว! 🎉*\n`;
            }

            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `answer-sheet-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportToHTML() {
            const choices = getChoices();
            let html = `<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR Answer Sheet</title>
    <style>
        body {
            font-family: 'Sarabun', Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .sheet {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }
        .info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 5px solid #667eea;
        }
        .info p {
            margin: 8px 0;
        }
        .question {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }
        .question:hover {
            background: #f9fafb;
        }
        .question-num {
            font-weight: bold;
            font-size: 18px;
            min-width: 50px;
            color: #374151;
        }
        .choices {
            display: flex;
            gap: 20px;
        }
        .choice {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #374151;
            display: inline-block;
            text-align: center;
            font-weight: bold;
            line-height: 18px;
        }
        .checkbox.checked {
            background: #667eea;
            color: white;
        }
        .label {
            font-weight: 600;
            color: #374151;
        }
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid #10b981;
            border-radius: 8px;
        }
        .summary h2 {
            color: #059669;
            margin-bottom: 15px;
        }
        .summary table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .summary th, .summary td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #d1fae5;
        }
        .summary th {
            background: #d1fae5;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="sheet">
        <h1>📝 OMR Answer Sheet</h1>
        <div class="info">
            <p><strong>วันที่สร้าง:</strong> ${new Date().toLocaleDateString('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            })}</p>
            <p><strong>จำนวนข้อทั้งหมด:</strong> ${numQuestions} ข้อ</p>
            <p><strong>จำนวนตัวเลือก:</strong> ${numChoices} (${choices.join(', ')})</p>
        </div>

        <div class="questions">
`;

            for (let i = 1; i <= numQuestions; i++) {
                const answer = answers[i];
                html += `            <div class="question">
                <div class="question-num">${i}.</div>
                <div class="choices">
`;
                choices.forEach(choice => {
                    const checked = answer === choice ? ' checked' : '';
                    const checkMark = answer === choice ? '✓' : '';
                    html += `                    <div class="choice">
                        <span class="checkbox${checked}">${checkMark}</span>
                        <span class="label">${choice}</span>
                    </div>
`;
                });
                html += `                </div>
            </div>
`;
            }

            html += `        </div>

        <div class="summary">
            <h2>📊 สรุปผล</h2>
            <table>
                <tr>
                    <th>รายการ</th>
                    <th>จำนวน</th>
                </tr>
                <tr>
                    <td>✅ ตอบแล้ว</td>
                    <td><strong>${Object.keys(answers).length} ข้อ</strong></td>
                </tr>
                <tr>
                    <td>⏳ ยังไม่ได้ตอบ</td>
                    <td><strong>${numQuestions - Object.keys(answers).length} ข้อ</strong></td>
                </tr>
                <tr>
                    <td>📝 รวมทั้งหมด</td>
                    <td><strong>${numQuestions} ข้อ</strong></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `answer-sheet-${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
